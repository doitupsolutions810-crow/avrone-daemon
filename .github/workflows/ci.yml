name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04    # pinned runner image; see actions/runner-images migration note
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avrone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avrone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install avrone (dev)
        run: |
          set -o pipefail
          # Defensive checkout hygiene: some file-delivery layers prepend a
          # status line ("successfully downloaded text file (SHA: ...)") to
          # delivered text files. Line 1 must parse as TOML/JSON/py source, so
          # strip such a wrapper line when present (no-op on clean checkouts).
          grep -rlI --exclude-dir=.git '^successfully downloaded text file' . 2>/dev/null \
            | while IFS= read -r f; do sed -i '1{/^successfully downloaded text file/d}' "$f"; done || true
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]" 2>&1 | tee /tmp/pip.log || {
            tail -n 8 /tmp/pip.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
      - name: Focused trial receiver tests
        run: pytest -q tests/test_trial_contract.py tests/test_trial_receiver.py tests/test_trial_adapters.py
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }
      - name: PostgreSQL shared-store adversarial tests
        run: pytest -q tests/test_trial_postgres.py
        env:
          AVRONE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/avrone_test
      - name: Test avrone
        run: |
          set -o pipefail
          grep -rlI --exclude-dir=.git '^successfully downloaded text file' . 2>/dev/null \
            | while IFS= read -r f; do sed -i '1{/^successfully downloaded text file/d}' "$f"; done || true
          pytest -q 2>&1 | tee /tmp/pytest.log || {
            tail -n 10 /tmp/pytest.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }
