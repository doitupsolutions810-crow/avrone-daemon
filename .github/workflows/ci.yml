name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748)
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install avrone (dev + optional integrations)
        run: |
          set -o pipefail
          # Defensive checkout hygiene: some file-delivery layers prepend a
          # status line ("successfully downloaded text file (SHA: ...)") to
          # delivered text files. Line 1 must parse as TOML/JSON/py source, so
          # strip such a wrapper line when present (no-op on clean checkouts).
          # `if grep` is required: grep exits 1 when nothing matches, and
          # `set -o pipefail` under `bash -e` would abort the job before pip.
          if grep -rlI --exclude-dir=.git '^successfully downloaded text file' . > /tmp/wrapped-files.txt 2>/dev/null; then
            while IFS= read -r f; do sed -i '1{/^successfully downloaded text file/d}' "$f"; done < /tmp/wrapped-files.txt
          fi
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,observability,redis-memory]" 2>&1 | tee /tmp/pip.log || {
            tail -n 8 /tmp/pip.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
      - name: Focused trial receiver tests
        run: |
          pytest -q tests/test_trial_contract.py tests/test_trial_receiver.py tests/test_trial_adapters.py tests/test_trial_api.py tests/test_trial_edge_cases.py tests/test_trial_boundary_matrix.py tests/test_trial_adversarial_properties.py tests/test_trial_sender_adversarial.py tests/test_trial_snapshot_integrity.py tests/test_trial_storage_parent_permissions.py tests/test_trial_database_identity.py tests/test_trial_sidecar_safety.py tests/test_trial_ownership_mode.py tests/test_trial_persisted_integrity.py tests/test_trial_quarantine_integrity.py tests/test_trial_sender_quarantine_state.py tests/test_trial_provenance_integrity.py tests/test_trial_quarantine_transactions.py tests/test_trial_conflict_reason_semantics.py tests/test_trial_receipt_integrity.py tests/test_trial_bounded_audit.py tests/test_trial_source_index_integrity.py tests/test_trial_replay_fuzz.py tests/test_trial_live_index_drift.py tests/test_trial_source_trigger_integrity.py tests/test_trial_primary_key_integrity.py tests/test_trial_concurrent_startup.py tests/test_trial_quarantine_event_ids.py tests/test_trial_sidecar_permissions.py tests/test_trial_bounded_migration.py tests/test_trial_receiver_clock.py tests/test_trial_real_legacy_rollback.py tests/test_trial_clock_integer_extremes.py tests/test_trial_bounded_sqlite_blobs.py tests/test_trial_wal_umask_stress.py tests/test_trial_wal_recovery_edges.py tests/test_trial_fd_permissions.py tests/test_trial_private_create.py tests/test_trial_create_identity_handoff.py tests/test_trial_event_autoincrement.py tests/test_trial_read_snapshots.py tests/test_trial_readonly_audit.py tests/test_trial_audit_authorizer.py tests/test_trial_causal_chronology.py tests/test_trial_receipt_cardinality.py tests/test_trial_state_machine_model.py tests/test_trial_receipt_ordering.py tests/test_tools_extra.py tests/test_master_prompt.py
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }
      - name: Test avrone
        run: |
          set -o pipefail
          if grep -rlI --exclude-dir=.git '^successfully downloaded text file' . > /tmp/wrapped-files.txt 2>/dev/null; then
            while IFS= read -r f; do sed -i '1{/^successfully downloaded text file/d}' "$f"; done < /tmp/wrapped-files.txt
          fi
          pytest -q 2>&1 | tee /tmp/pytest.log || {
            tail -n 10 /tmp/pytest.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }
